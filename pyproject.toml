[build-system]
# >=83: PYSEC-2026-3447 / CVE-2026-59890 -- older setuptools applied
# MANIFEST.in exclude/prune directives without Unicode normalization, so on
# macOS filesystems an NFD-named file could bypass an NFC exclusion and be
# packed into the sdist. This project's sdist governance is exactly that
# MANIFEST machinery, so the fixed release is a build-time floor, not an
# audit suppression (grind r3, R61/b2:B5). >=77 was the PEP 639 license floor.
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "torchlens"
version = "2.34.1"
description = "A package for extracting activations from PyTorch models and saving portable bundles"
readme = "README.md"
license = "Apache-2.0"
# 3.10 is the real floor: the package uses @dataclass(slots=True) in 143 places
# across 31 modules, and `slots=True` is Python 3.10+, so `import torchlens`
# cannot succeed on 3.9. CI tests 3.10 and 3.11.
requires-python = ">=3.10"
authors = [
    {name = "JohnMark Taylor", email = "johnmarkedwardtaylor@gmail.com"},
]
keywords = ["torch", "torchlens", "activations", "features", "io"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "packaging",
    # torch>=2.1 supported. The only torch-2.4-specific APIs TorchLens used were
    # torch.is_autocast_enabled(device_type) / torch.get_autocast_dtype(device_type)
    # (the device_type argument is torch 2.4+ only); these are now routed through
    # a backward-compatible shim (torchlens/utils/_torch_compat.py) that falls back
    # to the legacy per-device autocast helpers on torch 2.1-2.3. Lowering the floor
    # to 2.1 unblocks frameworks pinned to older torch (e.g. the OpenMMLab stack,
    # which caps mmcv<2.2 -> prebuilt wheels only for torch<=2.1).
    #
    # The floor is PYTHON-CONDITIONED because a bare torch>=2.1 is UNSATISFIABLE
    # on newer interpreters (grind r3, R85/SF-16, measured): the first torch with
    # cp312 wheels is 2.2.0 and the first with cp313 wheels is 2.6.0, so on
    # py3.12/3.13 the resolver either fails or falls back to a source build that
    # cannot succeed. The support floor is unchanged (2.1 wherever 2.1 exists);
    # these markers only state where each interpreter's real floor sits.
    "torch>=2.1; python_version < '3.12'",
    "torch>=2.2; python_version == '3.12'",
    "torch>=2.6; python_version >= '3.13'",
    "safetensors>=0.4",
    "tqdm",
    "graphviz",
    # typing_extensions.Self is used for Python 3.10 (typing.Self is 3.11+).
    "typing_extensions>=4.0",
    # Pillow backs the viz / repgeom image-rendering surfaces (node images,
    # input montages, MDS/feature-map thumbnails). It is resolved at CALL time,
    # not import time -- `import torchlens` succeeds with PIL absent (probed
    # 2026-08-15; the old "hard import-time dependency" rationale was false,
    # grind r3 SF-15). It stays a base dependency so the default drawing
    # surface works out of the box; moving it to an extra is a queued owner
    # decision, not a hygiene fix.
    "pillow>=9",
]

[project.optional-dependencies]
notebook = ["ipython>=8.0", "jupyter-client>=8.0"]
neuro = ["rsatoolbox~=0.1.5", "brain-score~=2.2"]
viz = ["torchshow~=0.5", "lovely-tensors~=0.1.18"]
tabular = ["pandas>=2.0", "pyarrow>=14"]
captum = ["captum~=0.7"]
sae = ["sae-lens~=6.45; python_version >= '3.10'"]
# `profiler` is an intentional no-op capability marker: torch.profiler ships with
# torch itself, so this extra pulls no extra packages but stays advertised so users
# and tooling can request the profiler surface by name.
profiler = []
lightning = ["lightning~=2.4"]
wandb = ["wandb>=0.16"]
# 0.26.5 is excluded because its manylinux wheel ships without libmlx.so (the
# nightly preview-backend leg pins 0.26.3 for the same reason): the extra must
# not admit a version the CI matrix documents as import-broken on Linux.
mlx = ["mlx>=0.26,<0.27,!=0.26.5"]
jax = ["jax[cpu]", "equinox", "flax"]
tinygrad = ["tinygrad>=0.13,<0.14; python_version >= '3.11'"]
paddle = ["paddlepaddle>=3.3,<3.4"]
tf = ["tensorflow>=2.16"]
tensorflow = ["tensorflow>=2.16"]
hf = ["transformers~=4.45", "timm~=1.0"]
gradcam = ["grad-cam~=1.5"]
shap = ["shap~=0.46"]
inseq = ["inseq~=0.6"]
steering = ["steering-vectors~=0.1"]
repeng = ["repeng~=0.4"]
dialz = ["dialz~=0.2"]
nnsight = ["nnsight~=0.4"]
lit = ["lit-nlp~=1.3"]
depyf = ["depyf~=0.18"]
compat-shims = ["torchextractor>=0.3,<2", "sentence-transformers>=2.5,<5"]
vision-shims = ["torchvision>=0.18,<1"]
# `all` installs the curated, mutually-compatible union of optional integration
# extras. It aliases `all-stretch` (the vetted satisfiable set) so the two never
# drift: a literal "everything" is unsatisfiable because the framework-backend
# extras (jax/tf/tensorflow/paddle/mlx/tinygrad) impose conflicting pins, so they
# are deliberately excluded from the meta-rollup. `pip install torchlens[all]`
# therefore installs exactly the same packages as `torchlens[all-stretch]`.
all = ["torchlens[all-stretch]"]
all-stretch = [
    "grad-cam~=1.5",
    "shap~=0.46",
    "inseq~=0.6",
    "steering-vectors~=0.1",
    "repeng~=0.4",
    "dialz~=0.2",
    "lit-nlp~=1.3",
    "depyf~=0.18",
    "torchextractor>=0.3,<2",
    "sentence-transformers>=2.5,<5",
    "torchvision>=0.18,<1",
    "torchshow~=0.5",
    "lovely-tensors~=0.1.18",
]
dev = [
    # Tooling floors are BOUNDED at the next major (grind r3, b2:B6): these
    # tools' majors routinely change verdicts (pytest collection rules,
    # pre-commit config schema, jsonschema validator API), so an unbounded
    # floor lets a future major silently change what the gates enforce. Exact
    # pins stay reserved for the verdict-defining trio (ruff/mypy/pip-audit).
    "ruff==0.15.4",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "mypy==2.1.0",
    "pip-audit==2.10.1",
    "pre-commit>=4,<5",
    # jsonschema/referencing back the menagerie crawler's payload validation
    # (menagerie/crawler/schema.py: Draft202012Validator + a referencing Registry).
    # This is internal contributor/automation tooling, not a torchlens runtime
    # feature, so it lives alongside the other dev-tooling packages rather than
    # in `test` (ML-framework test deps) or core `dependencies` (shipped library
    # surface). `registry=` on Draft202012Validator needs jsonschema>=4.18, the
    # version that adopted the `referencing` library for $ref resolution.
    "jsonschema>=4.18,<5",
    "referencing>=0.28,<1",
]
test = [
    "lightning",
    "pydot",
    "pillow",
    "pytest",
    "pytest-timeout",
    "requests",
    "soxr",
    "timm",
    "torchaudio",
    "torch_geometric",
    "torchvision",
    # menagerie catalog machinery (menagerie/schema.py, menagerie/envs.py,
    # menagerie/ledger.py) hard-imports these at module load / call time with no
    # try/except guard. They are exercised directly by tests/test_menagerie_*.py
    # (e.g. test_menagerie_schema.py imports pydantic.ValidationError,
    # test_menagerie_envs.py calls envs.load_registry() which parses YAML).
    # pydantic is not currently pulled in transitively by anything else in this
    # extra and its absence is a hard ModuleNotFoundError on a clean install;
    # PyYAML/psutil happen to be pulled in transitively today (e.g. via
    # lightning/timm/transformers) but are undeclared direct imports, so they are
    # declared explicitly here too rather than relying on incidental transitive
    # resolution.
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "psutil>=5.9",
    "transformers",
    "visualpriors",
]

[project.urls]
Homepage = "https://github.com/johnmarktaylor91/torchlens"
Repository = "https://github.com/johnmarktaylor91/torchlens"

[tool.setuptools.packages.find]
# menagerie* is deliberately NOT distributed. It is a dated reference corpus (the
# model atlas + its crawler), not part of the importable library: it depends on
# torchlens rather than the reverse, nothing in torchlens imports it, and
# including it shipped 2886 of the wheel's 3316 members (~13.5 MB) into every
# `pip install torchlens` while squatting `menagerie` as a top-level import name.
# It stays in the repo and the sdist-from-git; consumers use it from a checkout.
# Asserted by tests/test_packaging_diet.py::test_built_wheel_manifest_is_diet.
include = ["torchlens*"]

[tool.setuptools.package-data]
# py.typed is REQUIRED for PEP 561: without it downstream mypy silently ignores
# every annotation in the package.
torchlens = [
    "py.typed",
    "autoroute/data/*.json",
    "autoroute/data/*.md",
    "schemas/*.json",
]

[tool.setuptools.exclude-package-data]
# WHEEL authority for the agent-doc exclusion. MANIFEST.in excludes govern the
# sdist only: building a wheel from the source tree collects package data
# through include-package-data (default true for pyproject builds), which does
# NOT re-apply MANIFEST.in exclude directives — the round-1 blanket `*.md`
# include shipped 32 CLAUDE.md/AGENTS.md agent docs (~135 kB, private sprint
# IDs) into every `pip install torchlens` (grind r3, R84 regression-by-fix).
# Asserted by tests/test_packaging_diet.py::test_built_wheel_manifest_is_diet.
"*" = ["CLAUDE.md", "AGENTS.md"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "heavy: marks mid-cost tests excluded from the fast per-step gate (select/deselect with '-m heavy' / '-m \"not heavy\"')",
    "smoke: marks tests as smoke tests for quick critical-path validation (select with '-m smoke')",
    "serial: marks load-sensitive tests that should run away from parallel worker load",
    "rare: marks tests that are always excluded unless explicitly requested (select with '-m rare')",
    "optional: marks tests that require optional dependencies",
    "requires_assertions: marks tests that need `assert` to execute (skipped under python -O)",
    "backend_parity: marks active backend substrate parity gates",
    "backend_jax: marks tests that require the optional JAX backend runtime",
    "backend_mlx: marks tests that require the optional MLX backend runtime",
    "backend_tinygrad: marks tests that require the optional tinygrad backend runtime",
    "backend_paddle: marks tests that require the optional paddle backend runtime",
    "tf_backend: marks tests that require the optional TensorFlow backend runtime",
]
addopts = "-m 'not rare'"
xfail_strict = true
filterwarnings = [
    # TorchLens-originated warnings should be deliberate and locally asserted.
    # NOTE: pytest applies filterwarnings bottom-to-top priority (later entries win),
    # so the broad error rules go FIRST and the message-specific "default" exceptions
    # below them take precedence for their exact messages. Public compatibility aliases
    # (layers_to_save=, etc.) and older-bundle-version loads are intentionally exercised
    # across legacy tests and stay visible-not-fatal; deprecation-specific tests assert
    # them locally.
    "error::DeprecationWarning:torchlens(\\.|$)",
    "error::UserWarning:torchlens(\\.|$)",
    # TorchLens's own deprecations are promoted by CATEGORY, not by attributed
    # module. Since the alias/shim routes resolve `stacklevel` dynamically to
    # blame the CALLER (torchlens/_deprecations.py), the warning is attributed
    # to user/test code, so the module-keyed rule above can no longer see them
    # -- keying on the dedicated subclass is depth-independent and cannot be
    # disarmed by a change in call depth.
    "error::torchlens._deprecations.TorchLensDeprecationWarning",
    # Expected graceful torch-capability degradations (e.g. functorch level API absent on
    # torch 2.1) flip a HAS_* flag and warn once; visible-not-fatal across the torch matrix.
    "default:TorchLens torch capability .* is unavailable;.*:UserWarning:torchlens(\\.|$)",
    # Informational opt-in caveat (reference save-mode shares tensors); visible once, not
    # fatal -- like the capability-degradation warning above. Fires whenever save_mode=
    # 'reference' is used, so it is not per-test assertable.
    "default:save_mode='reference' stores source tensors by reference.*:UserWarning:torchlens(\\.|$)",
    # Informational disclosure (r6 H2): an activation archive saved from a `save=` selective
    # capture records no original-input digests, so numeric attestation can never apply.
    # Fires for every selective include_activations= save -- a commonly exercised idiom, so
    # like the save_mode caveat above it is not per-test assertable. Asserted locally in
    # tests/test_io_runnable_payload_integrity.py, which resets the one-time flag first.
    "default:This runnable save archives activations but records no original-input.*:UserWarning:torchlens(\\.|$)",
    # Torch-originated TORCH_WARN_ONCE caveats (torch>=2.13) attributed to torchlens only
    # because the wrapped __float__/item()/tensor-factory frame sits at the warning's
    # stacklevel. These are third-party (torch's own) warnings, not TorchLens-originated, so
    # the message-narrow exemptions below stop the broad error::UserWarning:torchlens rule
    # from mis-promoting them; genuine TorchLens-originated UserWarnings still error.
    "default:Converting a tensor with requires_grad=True to a scalar.*:UserWarning:torchlens(\\.|$)",
    "default:Sparse invariant checks are implicitly disabled.*:UserWarning:torchlens(\\.|$)",
    # STRUCTURAL exemption for the same class (grind p3, B2P3-8): every C++-originated
    # TORCH_WARN/TORCH_WARN_ONCE carries the "(Triggered internally at <file>:<line>)"
    # suffix that no TorchLens-authored warning ever emits. After the first capture wraps
    # torch, ANY first-firing torch C++ warning reached through a wrapped call is
    # attributed to torchlens.backends.torch.wrappers and was promoted to a hard error by
    # the broad rule above -- a one-shot order-sensitive landmine per warning (run alone,
    # the same warning fires pre-wrap in the test module and stays benign). Keying on the
    # torch-internal suffix exempts the whole third-party class without listing messages;
    # genuine TorchLens-originated UserWarnings still error.
    "default:(?s).*\\(Triggered internally at :UserWarning:torchlens(\\.|$)",
    # Public compatibility aliases are exercised deliberately across legacy tests,
    # so the alias-deprecation message shape stays visible-not-fatal. QUALIFIED to
    # the TorchLens category (grind b4, R48-4): the unqualified rule matched ANY
    # library's deprecation whose message happened to fit this shape, and it is the
    # rule that makes `error::...TorchLensDeprecationWarning` above non-fatal for
    # these, so it must not reach further than TorchLens's own aliases. Internal
    # self-deprecation is caught by tests/test_no_internal_self_deprecation.py,
    # which bypasses ini filters; no message-shape rule can distinguish origin.
    "default:`.*` is deprecated; use `.*` instead\\..*:torchlens._deprecations.TorchLensDeprecationWarning",
    # The other two documented legacy families, same doctrine as the alias rule
    # above: moved top-level names and paper-era API shims are deliberately
    # exercised across legacy tests, and deprecation-specific tests assert them
    # locally. Before the stacklevel fix these were fatal or not depending purely
    # on whether the hardcoded stacklevel happened to land inside torchlens/ --
    # `tl.ModelHistory` errored, `tl.log_forward_pass(...)` did not. Stating the
    # policy explicitly replaces that accident. A TorchLens deprecation that is
    # NOT one of these three families still errors.
    "default:torchlens\\..* is deprecated; use .* instead\\. Removed in .*:torchlens._deprecations.TorchLensDeprecationWarning",
    "default:torchlens\\..* is deprecated; use .* instead\\. The old paper-era name.*:torchlens._deprecations.TorchLensDeprecationWarning",
    # Between-floor artifact-age advisory (grind r3, R15-F1). Recategorized from
    # DeprecationWarning to the visible ArtifactSchemaAgeWarning (a UserWarning
    # subclass) because it deprecates no API; legacy-bundle tests exercise it
    # broadly, so it stays visible-not-fatal and is asserted locally.
    "default:Bundle tlspec_version=.* is older than runtime tlspec_version=.*:UserWarning",
    # External: torchvision model init deprecations
    "ignore:The default weight initialization of.*:FutureWarning",
    # External: torch.meshgrid indexing argument
    "ignore:torch.meshgrid.*:UserWarning",
    # External: timm deprecated model name mappings
    "ignore:Mapping deprecated model name.*:UserWarning",
    # External: torch.nn.utils.weight_norm deprecation
    "ignore:`torch.nn.utils.weight_norm` is deprecated.*:FutureWarning",
    # External: complex-to-real casting warning
    "ignore:Casting complex values to real.*:UserWarning",
    # External: transformer nested_tensor batch_first warning
    "ignore:enable_nested_tensor is True.*:UserWarning",
]

[tool.coverage.run]
source = ["torchlens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "tests/generated_outputs/reports/coverage_html"

[tool.coverage.lcov]
output = "tests/generated_outputs/coverage.lcov"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
# Check bodies of unannotated functions so the package ratchet catches local drift.
check_untyped_defs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100

# EXCLUDE AUTHORITY: the judged file set lives here, not in CLI flags, so that
# pre-commit (which passes explicit staged filenames) and CI (which passes
# directories) reach the SAME verdict. `extend-exclude` participates in
# --force-exclude, which the ruff-pre-commit hooks pass by default.
#   menagerie/            - vendored/ported real model source + generated recipes
#                           (see the per-file-ignores rationale below)
#   tests/crawler/        - menagerie crawler harness, same provenance
#   tests/test_menagerie_*- menagerie-only test surface
#
# GENERATED ARTIFACTS are excluded too: their GENERATOR is the authority and
# tests/test_schema_lockstep.py compares them BYTE-FOR-BYTE to fresh generator
# output, so any ruff rewrite (format, isort, UP*) would make the lockstep gate
# permanently red. They declare themselves with a `GENERATED` marker on their
# docstring's first line, and
# test_schema_lockstep.py::test_ruff_excludes_every_generated_artifact keeps this
# list equal to that self-declaring set -- a new generated module cannot land
# without its exclusion, and a stale exclusion cannot outlive its generator.
extend-exclude = [
    "menagerie",
    "tests/crawler",
    "tests/test_menagerie_*.py",
    "torchlens/data_classes/_schema_bindings.py",
    "torchlens/ir/op_record_manifest.py",
]

[tool.ruff.lint]
# RULE-FAMILY RATCHET. `select` grows MONOTONICALLY, one bounded wave per grind
# round; it is never narrowed. Naming `select` replaces ruff's implicit default,
# so the four default groups (E4/E7/E9/F) are restated here and stay enforced.
#
# grind round 3 wave: I (import order), B (bugbear), SIM (simplify),
# UP (pyupgrade), C4 (comprehensions). 3748 violations found, 3203 fixed.
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "C4"]

# DEFERRAL LEDGER. Each entry is a code inside an ENABLED family that is not yet
# clean, with its reason and (where applicable) its owning grind row. This is the
# honest alternative to leaving a whole family out of `select`: the family is ON,
# so no new site of any OTHER code in it can land, and every exception is named.
# Entries leave this list; nothing joins it without a reason.
ignore = [
    # --- proven harmful HERE, not merely deferred -------------------------------
    # B009/B010 rewrite `getattr(o, "x")` / `setattr(o, "x", v)` into attribute
    # access. TorchLens deliberately writes and reads OUT-OF-TYPE metadata on
    # FOREIGN objects (torch.Tensor, nn.Module, wrapped callables), and the
    # getattr/setattr spelling is load-bearing there: it is what tells the reader
    # AND mypy that the attribute is not part of the object's declared type.
    # Enabling them traded 214 cosmetic rewrites for 59 NEW mypy
    # `[attr-defined]` errors (measured: 1 -> 60), and it also broke
    # tests/test_no_legacy_tl_attrs.py, whose whole job is to ban direct `tl_*`
    # attribute access in source. Not a ratchet candidate without a typed
    # host-metadata accessor to route these through first.
    "B009",
    "B010",

    # SIM118 (`x in d.keys()` -> `x in d`) is WRONG on TorchLens accessors, which
    # are dict-LIKE enough to fool the rule but whose `__iter__` yields RECORDS
    # while `.keys()` yields LABELS. Applying it turned `for label in
    # trace.saved_grad_ops.keys()` into a loop over `Op` objects and
    # `trace.layers[label]` into a `Layer`-keyed lookup: 11 smoke failures, all
    # silent type confusion rather than an obvious break. Reverted at 55 sites.
    # Re-enabling needs the accessor iteration contract settled first (a public
    # API question, not a lint one).
    "SIM118",
    # SIM401 (`d[k] if k in d else default` -> `d.get(k, default)`) fails for the
    # same reason: the accessors implement `__getitem__`/`__contains__` but NOT
    # `Mapping`, so `.get` does not exist and the rewrite raises AttributeError at
    # render time (`ModuleAccessor` in collapse_optimizer.py). Reverted at 2 sites;
    # blocked behind the same accessor-protocol decision as SIM118.
    "SIM401",

    # --- owned by another grind row: do NOT double-fix here ---------------------
    "B905",  # zip-without-explicit-strict -> row R23 (105 sites)
    "B028",  # no-explicit-stacklevel -> row R66, warnings hygiene (9 sites)

    # --- judgment calls, later rounds ------------------------------------------
    # 102 sites. if/else -> ternary is a readability call, and several sit in
    # invariant-heavy code where the explicit branch carries a per-arm comment.
    "SIM108",
    # 74 sites. `contextlib.suppress` is measurably slower than bare
    # try/except/pass, and several of these sit on capture hot paths the
    # SPEEDENING sprint tuned. Needs a per-site perf verdict, not a sweep.
    "SIM105",
    # 37 sites. Collapsing the two `if`s orphans the per-branch comments that
    # explain why the second condition is separate.
    "SIM102",
    # 27 sites, no ruff fix. Combining `with` statements changes teardown ORDER
    # on failure, which is load-bearing for the capture/restore transactions.
    "SIM117",
    # 8 sites. Each needs a real handle-lifetime decision, not a mechanical
    # context-manager wrap.
    "SIM115",
    # 16 sites. printf -> format changes message TEXT, and error-message tests
    # match on it.
    "UP031",
    # 16 sites. `raise ... from` changes traceback chaining and several sites
    # deliberately drop the context; each needs a verdict.
    "B904",
    # 13 sites. Several are intentional "this attribute access must not raise"
    # probes in tests, where the bare expression IS the assertion.
    "B018",
    # 15 sites. This is a REAL bug class (late-binding closure over a loop
    # variable), so every site needs a correctness verdict AND a regression test
    # -- exactly what a mechanical rewrite would paper over. Highest-value item
    # left in this ledger.
    "B023",
    # 13 sites with no ruff fix (the name is referenced, or is a tuple unpack).
    "B007",
    # 3 sites. A call in a default argument is sometimes load-bearing for a
    # captured closure; needs a per-site read.
    "B008",
]

[tool.ruff.lint.isort]
# Match the style already in the tree: keep aliased imports combined on one line
# (`from x import a as b, c as d`) rather than exploding each into its own
# statement, which would rewrite hundreds of import blocks for no gain.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Example/tutorial notebooks intentionally keep broad setup imports in shared
# starter cells even when a given cell path does not consume every symbol.
"examples/**/*.ipynb" = ["F401"]
"notebooks/**/*.ipynb" = ["F401"]

# Audit notebooks (notebooks/audit/) use a sys.path shim + matplotlib.use() before
# importing the model zoo / torchlens, so module-level imports legitimately follow
# code (E402). This shim is mandated by notebooks/audit/CLAUDE.md.
"notebooks/audit/*.ipynb" = ["E402", "F401"]

# menagerie/classics/ holds faithful random-init architecture reconstructions AND vendored/
# ported REAL repo code (the model atlas). They are compact recipes / verbatim vendored source,
# not first-party library code: dense one-line block definitions (E702), conventional math/ML
# single-letter names like l/I/O for layers/identity (E741), unused imports kept verbatim from
# the real source (F401), intentional dead scaffolding vars kept for readability of the
# reconstructed forward (F841), and lambda-assignment factory idioms common in vendored source,
# e.g. lucidrains repos (E731). Vendored source also keeps its original `type(x) == T`
# comparisons (E721). Enforcing these would mean editing generated/vendored forwards
# and perturbing already-rendered architecture graphs or diverging from the real source.
# Real-bug lints (F821/F811/etc.) stay enforced.
"menagerie/classics/*.py" = ["E702", "E741", "F401", "F841", "E731", "E712", "E721", "E402", "E711"]

# =============================================================================
# RELEASE POLICY (locked): TorchLens stays on the 2.x family on PyPI.
# Major version bumps require explicit JMT authorization in the same turn and
# must be cut manually via `semantic-release version --force-level major`.
# Three layers of defense prevent accidental major bumps:
#   1. commit-msg hook (rejects `!:` / `BREAKING CHANGE:` at commit time)
#   2. pre-push hook   (rejects them at push time)
#   3. custom parser   (downgrades MAJOR -> MINOR if anything slips past 1+2)
# See scripts/check_no_breaking_markers.py and scripts/no_major_parser.py.
# Background: ~/.claude/.../memory/feedback_version_bumps.md (THREE incidents).
# =============================================================================
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["torchlens/__init__.py:__version__"]
branch = "main"
major_on_zero = true
# build== is PINNED (the old unpinned install resolved arbitrary code while
# the release App token sat on disk from checkout) and SOURCE_DATE_EPOCH is
# set from the released commit so the shipped wheel is bit-reproducible from
# its tag (grind r3, R86). PIN AUTHORITY: keep equal to the nightly wheel
# job's `build==` pin, whose double-build gate attests exactly this builder.
build_command = "pip install 'build==1.5.0' && SOURCE_DATE_EPOCH=\"$(git log -1 --pretty=%ct)\" python -m build"
# `[skip ci]` is REQUIRED: the bot pushes this commit to main, and without the
# skip token GitHub re-triggers the Release workflow on it, which re-releases and
# pushes again -> infinite loop. (See git history: a 1599-commit runaway.)
commit_message = "chore(release): {version} [skip ci]"
# Layer 3: custom parser that refuses to emit LevelBump.MAJOR.
commit_parser = "scripts/no_major_parser.py:NoMajorAngularParser"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
upload_to_vcs_release = true
