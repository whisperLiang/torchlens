name: Latest Torch Canary

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: latest-torch-canary
  cancel-in-progress: true

jobs:
  latest-canary:
    name: Latest Torch canary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install latest CPU test environment
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular]" \
            torch \
            torchvision \
            "pydot==4.0.1"

      - name: Validate installed environment
        run: |
          uv pip check
          python - <<'PY'
          import torch
          import torchvision
          from torchvision.ops import nms

          boxes = torch.tensor([[0.0, 0.0, 1.0, 1.0]])
          scores = torch.tensor([1.0])
          assert nms(boxes, scores, 0.5).tolist() == [0]
          print(torch.__version__, torchvision.__version__)
          PY

      - name: Run smoke tests and compatibility coverage
        run: |
          # Exclude the menagerie build subsystem from smoke, matching tests.yml:
          # tests/test_menagerie_*.py hard-imports pydantic (via
          # menagerie/schema.py) and tests/crawler/ is the crawler corpus -- both
          # absent from this .[dev,tabular] env (pydantic is only in .[test]).
          # This is a py3.11 leg, so it is past the tests/conftest.py < 3.11
          # auto-skip and needs these explicit --ignore flags to avoid a
          # collection ModuleNotFoundError. No smoke coverage is lost (no
          # menagerie or crawler test is smoke-marked).
          pytest tests/ -m smoke --ignore-glob="*menagerie*" --ignore=tests/crawler --tb=short -q
          pytest tests/test_torch_compat.py --tb=short -q
