name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  release:
    needs: [lint, tests, quality]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    concurrency: release
    # Belt-and-suspenders with the `[skip ci]` token in the release commit
    # message: never run a release on the bot's own release commit, so a missing
    # skip token can't reignite the runaway release loop.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Minimal scope (zizmor github-app, T13.3): without an explicit
          # permission input the minted token inherits the App installation's
          # FULL permission set, and checkout persists it to disk for the
          # whole job — including the pip install and semantic-release steps.
          # Everything this job does (push the release commit + tag, create
          # the GitHub Release) needs exactly repository contents: write.
          permission-contents: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Must satisfy the package's requires-python (>=3.10): semantic-release's
          # build_command builds the shipped sdist/wheel on THIS interpreter, and a
          # 3.9 builder produced release artifacts on a Python the package itself
          # refuses to install on (T13.7).
          python-version: "3.11"

      # The version TAG push invokes git-lfs (a few .research/*.md files are
      # LFS-tracked). CI checks out with lfs disabled (pointers only, no LFS
      # content), so the push is rejected with "missing or corrupt local
      # objects" -- but those objects already live on the remote (pushed when
      # the files landed on main), so an incomplete push is safe here. Without
      # this, the tag never gets created and (pre-`[skip ci]`) every run
      # re-released -> the 1599-commit runaway. `locksverify=false` additionally
      # sidesteps the locking-API failure caused by the App's bracketed
      # credential URL (`torchlens-release[bot]`).
      - name: Let git-lfs tolerate the CI tag push
        run: |
          git config lfs.allowincompletepush true
          git config lfs.locksverify false

      - name: Install dependencies
        run: pip install "python-semantic-release==9.21.1"

      - name: Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: semantic-release version

      # `semantic-release version` only builds dist/* when it cuts a new version.
      # Non-releasing commits (ci/docs/chore/test/refactor pushed on their own)
      # produce no dist/, so gate the publish steps on artifacts actually existing
      # -- otherwise the PyPI upload fails with "FileNotFoundError: dist" and the
      # Release job goes red even though nothing was meant to ship. When a real
      # release IS cut, dist/* exists and both steps run normally.
      # DELIBERATELY NOT SHA-PINNED -- the one exception to the pin-everything rule
      # in this repo. PyPA's own documented guidance for this action is to track the
      # `release/v1` branch so that security fixes to the publishing path (and
      # changes required by PyPI's evolving Trusted Publishing / attestation
      # endpoints) arrive without a manual bump. A stale pinned SHA here fails
      # closed in the worst place: the release job. The trust anchor is the
      # PyPA-owned repo plus OIDC trusted publishing (no long-lived token to
      # steal), and this job's permissions are already minimized above.
      # Revisit if PyPA starts publishing immutable release tags for it.
      - name: Publish to PyPI
        if: ${{ hashFiles('dist/**') != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false

      - name: Publish to GitHub Releases
        if: ${{ hashFiles('dist/**') != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: semantic-release publish
