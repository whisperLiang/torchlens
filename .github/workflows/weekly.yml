name: Weekly

on:
  schedule:
    - cron: "23 5 * * 6"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  extended-tests:
    name: Slow and rare tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install torch and TorchLens
        run: |
          cat > "${{ runner.temp }}/torch-2.7-constraints.txt" <<'EOF'
          torch==2.7.*
          EOF
          uv pip install --system -c "${{ runner.temp }}/torch-2.7-constraints.txt" "torch==2.7.*" \
            --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -c "${{ runner.temp }}/torch-2.7-constraints.txt" -e ".[dev,test,tabular]"
          uv pip check
          python -c 'import torch; assert torch.__version__.startswith("2.7."), torch.__version__; print(torch.__version__)'

      - name: Run slow tests
        run: |
          pytest tests/ -m slow --tb=short

      - name: Run rare tests
        run: |
          pytest tests/ -m rare --tb=short
