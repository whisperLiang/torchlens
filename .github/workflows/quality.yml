name: Quality

on:
  workflow_call:
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.head_ref || github.ref }}-quality"
  cancel-in-progress: true

jobs:
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev]" \
            "torch==2.13.0+cpu"
          uv pip check
          python -c 'import torch; assert torch.__version__ == "2.13.0+cpu"; print(torch.__version__)'

      - name: Run mypy
        run: mypy torchlens/

  dep-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e . \
            "torch==2.13.0+cpu" \
            "pip-audit==2.10.1"
          uv pip check
          python -c 'import torch; assert torch.__version__ == "2.13.0+cpu"; print(torch.__version__)'

      - name: Run pip-audit
        # Two advisory IDs are suppressed below:
        #   * CVE-2026-3219 -- affects pip itself (the package on the GitHub
        #     runner image), which is outside this project's dependency surface
        #     and not actionable from pyproject.toml. Remove once a pip release
        #     with the fix is generally available.
        #   * PYSEC-2026-3447 -- suppression inherited without a recorded
        #     justification; its advisory target has NOT been re-verified here
        #     (that needs the advisory DB / network). FLAGGED for owner review:
        #     confirm it targets a non-actionable or transitive dependency, or
        #     drop this ignore so the advisory surfaces.
        run: pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2026-3447
