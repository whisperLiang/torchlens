name: Lint

on:
  workflow_call:
  pull_request:
    branches: [main]

# Default-deny token scope (grind r3, R61/b2:D1): every job in this
# workflow only reads the repo, so the GITHUB_TOKEN gets exactly that.
permissions:
  contents: read

concurrency:
  group: "${{ github.head_ref || github.ref }}-lint"
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # PIN AUTHORITY: keep in lockstep with pyproject.toml's dev extra and the
      # ruff-pre-commit `rev` in .pre-commit-config.yaml. See tests/
      # test_packaging_diet.py::test_ruff_pin_is_identical_across_declaration_sites.
      - run: uv pip install --system ruff==0.15.4

      # Check-only: Lint is a pure gate and must NOT push to main. It previously
      # ran `ruff format .` + `ruff check --fix .` then committed + pushed the
      # fixes, which raced with the Release workflow's push (both trigger on push
      # to main) and cascaded release runs. Format/lint locally before pushing.
      # The excluded set lives in pyproject.toml's `[tool.ruff] extend-exclude`,
      # NOT in CLI flags, so pre-commit (explicit staged filenames) and this gate
      # judge the same files. Verdicts were proven identical to the previous
      # CLI-flag form when the excludes moved.
      # SCOPE (grind r3, R70 / OL#41): widened from `torchlens tests scripts` to
      # cover the contributor-facing trees too. `menagerie` stays out through
      # pyproject's extend-exclude (vendored/ported real model source), and so do
      # the two generated artifacts, whose generator is the authority.
      - name: Ruff format check
        run: ruff format --check torchlens tests scripts tools benchmarks examples notebooks

      - name: Ruff check
        run: ruff check torchlens tests scripts tools benchmarks examples notebooks

  # Full-tree pre-commit parity gate (grind r3, R87): a PUBLIC repo with a
  # LOCKED privacy policy previously ran its hook chain only on locally staged
  # files, so fresh clones and CI never executed the secret scanners or
  # formatters at all, and .gitleaks.toml was referenced by nothing in-repo.
  # This is the same hook set contributors run locally -- one verdict.
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # Exact pin in a release-gating job (grind r4, R83): the parity verdict
      # must not move because pre-commit resolved a new minor overnight. The
      # dev extra keeps its bounded >=4,<5 range for contributors; this job is
      # the verdict environment.
      - run: uv pip install --system "pre-commit==4.6.2"

      - name: Verify the ruff hook SHA matches its claimed version tag
        # r7 R87 (opus MED): the ruff rev moved from a version tag to a git
        # SHA with a hand-written `# vX.Y.Z` trailer, so the version lockstep
        # test began validating an UNVERIFIED claim -- a bump that moves the
        # SHA and forgets the trailer (or lands on a wrong mirror commit)
        # passed green while the one --fix hook with write access WROTE with
        # a different ruff than the gate JUDGES. Resolving the claimed tag on
        # the hook repo and requiring it to equal the pinned SHA converts the
        # trailer into a checked binding.
        run: |
          rev="$(grep -A20 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml | grep -oEm1 'rev: [0-9a-f]{40}' | cut -d' ' -f2)"
          version="$(grep -A20 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml | grep -oEm1 'rev: [0-9a-f]{40} *# *v[0-9]+\.[0-9]+\.[0-9]+' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')"
          { test -n "$rev" && test -n "$version"; } || { echo "could not parse ruff hook rev/trailer"; exit 1; }
          resolved="$(git ls-remote --tags https://github.com/astral-sh/ruff-pre-commit "refs/tags/${version}^{}" | cut -f1)"
          if [ -z "$resolved" ]; then
            resolved="$(git ls-remote --tags https://github.com/astral-sh/ruff-pre-commit "refs/tags/${version}" | cut -f1)"
          fi
          test -n "$resolved" || { echo "tag ${version} not found on ruff-pre-commit"; exit 1; }
          if [ "$resolved" != "$rev" ]; then
            echo "ruff hook rev ${rev} does not match tag ${version} (${resolved}): the trailer is lying"
            exit 1
          fi
          echo "ruff hook rev verified: ${version} -> ${rev}"

      - name: Run every pre-commit hook over the full tree
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Full-tree gitleaks scan
        # The stock gitleaks hook reads the STAGED diff, so in the --all-files
        # run above nothing is staged and it scans ZERO content while the job
        # claimed secret coverage (grind r4, R87-1). The manual-stage variant
        # scans the checkout itself (gitleaks dir), making the secret gate
        # real on every PR.
        run: pre-commit run gitleaks-full-tree --hook-stage manual --all-files --show-diff-on-failure

  release-defenses:
    # The major-bump defense layers, exercised in CI (grind r5, b10 R86-2 +
    # R87-1): layer 3 (scripts/no_major_parser.py) previously had ZERO tests
    # anywhere and failed only at release time, and the two breaking-marker
    # hook layers ran in no CI job — the pre-commit job above runs only
    # default-stage hooks, so their commit-msg/pre-push stages are never
    # selected. This job (a) executes the parser tests under the SAME
    # hash-locked python-semantic-release the release job uses, so a PSR API
    # rename fails the PR that bumps the lock, and (b) scans the PR commit
    # range for breaking markers so a --no-verify push or a hookless clone
    # cannot land one with only the parser standing.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the hash-locked release stack + pytest
        run: |
          pip install --require-hashes --only-binary :all: \
            -r .github/workflows/release-requirements.txt
          pip install "pytest>=8,<10"

      - name: Run the no-major parser behavioral tests
        # The hard import first: if PSR ever fell out of the lock these
        # tests would importorskip to green — the exact green-skip disease
        # this repo keeps killing.
        run: |
          python -c "import semantic_release, git"
          pytest tests/test_no_major_parser.py --noconftest -p no:cacheprovider -q

      - name: Scan the PR commit range for breaking markers
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="$(git rev-parse HEAD)"
          printf 'refs/heads/pr %s refs/heads/base %s\n' "$head" "$base" | \
            python scripts/check_no_breaking_markers.py --pre-push

  # Workflow-file lint authority (schema, expressions, embedded shell via
  # shellcheck). Advisory CI job for now: whether it becomes a REQUIRED status
  # check is the queued R82-4 repo-settings decision (disputed-r2 b10/R82).
  # Version + checksum pinned to the official GitHub release.
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install actionlint 1.7.12 (checksum-pinned)
        run: |
          curl -sSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint

      - name: Run actionlint on all workflow files
        run: ./actionlint -color

      - name: Newest-admitted torch literal lockstep across workflows
        # The newest-admitted torch version is inlined in quality.yml (mypy +
        # dep-audit envs) and repeatedly in tests.yml's matrix with nothing
        # keeping them equal (grind r3, R85 LOW: 11 inlined copies, zero
        # tripwires) -- a matrix bump that skips quality.yml silently
        # type-checks and audits an older torch. The authority is tests.yml's
        # maximum matrix version; every quality.yml literal must equal it.
        # (The nightly capture-byte-oracle pin deliberately tracks the golden
        # ENV marker instead and is lockstepped by test_ci_packaging_gates.)
        run: |
          python - <<'PY'
          import pathlib
          import re

          # tests.yml declares versions as matrix values (torch: "X.Y.Z+cpu");
          # quality.yml inlines them as pip specs (torch==X.Y.Z+cpu).
          torch_re = re.compile(r"torch(?:==|: \")(\d+\.\d+\.\d+)\+cpu")
          tests = torch_re.findall(pathlib.Path(".github/workflows/tests.yml").read_text())
          quality = torch_re.findall(pathlib.Path(".github/workflows/quality.yml").read_text())
          assert tests and quality, "expected torch==X.Y.Z+cpu literals in tests.yml and quality.yml"
          newest = max(tests, key=lambda v: tuple(map(int, v.split("."))))
          stale = sorted(set(quality) - {newest})
          assert not stale, (
              f"quality.yml pins torch {stale} but tests.yml's newest-admitted row is {newest}: "
              "bump them together so type-check/audit run on the newest admitted torch"
          )
          print(f"quality.yml tracks the newest-admitted torch {newest} ({len(quality)} literals)")
          PY

      - name: Golden-fingerprint and audit pin lockstep (pydot, graphviz, jsonschema, pip-audit)
        # pydot is a DOT-render golden fingerprint KEY: the [test] extra is the
        # pin authority and the lean .[dev,tabular] legs repeat it inline, so a
        # bump that misses a site silently renders goldens with a different
        # pydot (grind r4, R83-6). pip-audit is dual-declared (dev extra +
        # quality.yml inline, where the inline copy is what actually runs);
        # same drift shape, same gate (R83-7). graphviz, the SIBLING python
        # DOT emitter, is an equal fingerprint KEY (committed ENV-graphviz
        # markers) but a CORE runtime dep that must stay a floor for users —
        # so its authority is the marker itself, and the CI inline pins must
        # equal it (grind r5, b10 R78-3).
        # r7 R83: the inline scans now cover EVERY workflow file — the old
        # hand-enumerated two-file list let mutation.yml's third pydot pin
        # drift unguarded from birth. jsonschema joins the gate: its three
        # tests.yml inline copies validate the menagerie release lock, so a
        # partial bump forks lock-validation verdicts between legs.
        run: |
          python - <<'PY'
          import pathlib
          import re

          pyproject = pathlib.Path("pyproject.toml").read_text()
          workflows = sorted(pathlib.Path(".github/workflows").glob("*.yml"))
          all_workflows = "".join(path.read_text() for path in workflows)
          quality = pathlib.Path(".github/workflows/quality.yml").read_text()

          pydot_authority = set(re.findall(r'"pydot==([0-9][^"]*)"', pyproject))
          assert len(pydot_authority) == 1, f"expected ONE pydot pin in pyproject: {pydot_authority}"
          pydot_inline = set(re.findall(r"pydot==([0-9][^\"'\s]*)", all_workflows))
          assert pydot_inline == pydot_authority, (
              f"inline pydot pins {pydot_inline} drifted from the [test] extra "
              f"authority {pydot_authority}: bump every site together or the "
              "DOT goldens' recording environment forks between tiers"
          )

          audit_authority = set(re.findall(r'"pip-audit==([0-9][^"]*)"', pyproject))
          assert len(audit_authority) == 1, f"expected ONE pip-audit pin in pyproject: {audit_authority}"
          audit_inline = set(re.findall(r"pip-audit==([0-9][^\"'\s]*)", quality))
          assert audit_inline == audit_authority, (
              f"quality.yml pip-audit pin {audit_inline} drifted from the dev "
              f"extra authority {audit_authority}: the inline copy is the one "
              "that actually audits releases"
          )

          jsonschema_inline = set(re.findall(r"jsonschema==([0-9][^\"'\s]*)", all_workflows))
          assert len(jsonschema_inline) <= 1, (
              f"inline jsonschema pins disagree across workflows: {jsonschema_inline} — "
              "the inline copy validates the menagerie release lock, so a partial "
              "bump forks lock-validation verdicts between legs (r7 R83-2)"
          )
          if jsonschema_inline:
              band = re.search(r'"jsonschema>=([0-9.]+),<([0-9.]+)"', pyproject)
              assert band is not None, "dev extra lost its jsonschema band"
              pinned = next(iter(jsonschema_inline))
              def _key(version): return tuple(int(part) for part in version.split("."))
              assert _key(band.group(1)) <= _key(pinned) < _key(band.group(2)), (
                  f"inline jsonschema {pinned} escaped the dev-extra band "
                  f">={band.group(1)},<{band.group(2)}"
              )

          markers = {
              path: pathlib.Path(path).read_text().strip()
              for path in (
                  "tests/golden/ENV-graphviz",
                  "tests/godobject_oracle/goldens/ENV-graphviz",
              )
          }
          marker_versions = set(markers.values())
          assert len(marker_versions) == 1, f"ENV-graphviz markers disagree: {markers}"
          gv_inline = set(re.findall(r"graphviz==([0-9][^\"'\s]*)", all_workflows))
          assert gv_inline == marker_versions, (
              f"inline graphviz pins {gv_inline} drifted from the committed "
              f"ENV-graphviz markers {marker_versions}: the python DOT emitter "
              "is a golden fingerprint KEY — a free resolution moves the byte "
              "families off-canonical on the enforcing row (b10 R78-3)"
          )
          print(
              f"pydot {pydot_authority}, graphviz {marker_versions}, jsonschema "
              f"{jsonschema_inline or '(no inline pins)'}, and "
              f"pip-audit {audit_authority} in lockstep"
          )
          PY
