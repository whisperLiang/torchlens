name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  perf-gate:
    name: Same-run performance regression gate
    runs-on: ubuntu-24.04
    # Scheduled/manual only: two smoke-suite runs cost several minutes and must
    # not extend the PR-blocking path. Comparing adjacent commits on the same
    # runner avoids treating developer-machine absolute baselines as portable.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install exact canonical CPU benchmark environment
        run: |
          uv venv "${{ runner.temp }}/perf-venv" --python 3.11
          uv pip install --python "${{ runner.temp }}/perf-venv/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular]" \
            "torch==2.8.0+cpu" \
            "torchvision==0.23.0+cpu" \
            numpy

      - name: Prepare adjacent-commit baseline checkout
        run: |
          git worktree add --detach "${{ runner.temp }}/perf-base" HEAD^

      - name: Measure baseline and current commit on the same runner
        env:
          PERF_PYTHON: ${{ runner.temp }}/perf-venv/bin/python
        run: |
          cd "${{ runner.temp }}/perf-base"
          PYTHONPATH=. "$PERF_PYTHON" -m benchmarks.perf_suite \
            --smoke --samples 10 --timeout 180 \
            --out-json "${{ runner.temp }}/perf-base.json" \
            --out-md "${{ runner.temp }}/perf-base.md"
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=. "$PERF_PYTHON" -m benchmarks.perf_suite \
            --smoke --samples 10 --timeout 180 \
            --out-json "${{ runner.temp }}/perf-current.json" \
            --out-md "${{ runner.temp }}/perf-current.md"

      - name: Fail on a measured regression
        env:
          PERF_PYTHON: ${{ runner.temp }}/perf-venv/bin/python
        run: |
          PYTHONPATH=. "$PERF_PYTHON" -m benchmarks.perf_gate \
            --baseline "${{ runner.temp }}/perf-base.json" \
            --current "${{ runner.temp }}/perf-current.json" \
            --out "${{ runner.temp }}/perf-comparison.json"

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-perf-gate
          path: |
            ${{ runner.temp }}/perf-base.json
            ${{ runner.temp }}/perf-current.json
            ${{ runner.temp }}/perf-comparison.json

  fast-tier:
    name: Full fast tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install torch and TorchLens
        run: |
          cat > "${{ runner.temp }}/torch-2.7-constraints.txt" <<'EOF'
          torch==2.7.*
          EOF
          uv pip install --system -c "${{ runner.temp }}/torch-2.7-constraints.txt" "torch==2.7.*" \
            --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -c "${{ runner.temp }}/torch-2.7-constraints.txt" -e ".[dev,test,tabular]"
          uv pip check
          python -c 'import torch; assert torch.__version__.startswith("2.7."), torch.__version__; print(torch.__version__)'

      - name: Run fast tests
        run: |
          # A command-line -m REPLACES (does not intersect) the pyproject
          # addopts "-m 'not rare'", so a bare -m "not slow" would silently
          # re-select rare-but-not-slow tests that the `rare` marker documents as
          # "always excluded unless explicitly requested". Conjoin `not rare` to
          # preserve that contract.
          pytest tests/ -m "not slow and not rare" --tb=short

  capture-byte-oracle:
    name: Capture-characterization byte oracle (torch 2.13.0, py 3.10)
    runs-on: ubuntu-24.04
    # The capture-characterization goldens embed raw float-byte digests, so
    # they are enforceable only on their recording environment (py3.10 +
    # torch 2.13.0; the version gate strips the build tag, mirroring
    # tests/_oracle_env.py). The 31-case matrix regenerates each record in an
    # isolated subprocess (~8 min), so it runs nightly rather than
    # PR-blocking. The executed-floor attestation proves the suite actually
    # ran instead of version-skipping to green (T13.2).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install the goldens' recording-environment torch
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular]" \
            "torch==2.13.0+cpu" \
            numpy
          uv pip check
          python -c 'import torch; assert torch.__version__ == "2.13.0+cpu", torch.__version__'

      - name: Run the slow capture-characterization matrix
        run: |
          pytest tests/capture_oracle/ -m slow --tb=short -q \
            --junitxml="${{ runner.temp }}/capture-oracle.junit.xml"

      - name: Fail on an under-executed capture-oracle matrix
        # Floor at roughly half the 31-case matrix: a version-gate or golden
        # drift that mass-skips the characterization must go red, while
        # adding/removing individual cases does not.
        run: |
          python scripts/check_ci_executed_tests.py \
            "${{ runner.temp }}/capture-oracle.junit.xml" 16

  preview-backends:
    name: Preview backend tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    # One framework per job: the frameworks carry conflicting pins and native
    # runtimes that segfault when co-imported in one process (test collection
    # imports every framework-marked module), so a combined env cannot be
    # gated. With a single framework installed, the other suites' module-level
    # importorskip guards skip cleanly during collection.
    strategy:
      fail-fast: false
      matrix:
        include:
          # executed_floor is a per-leg minimum EXECUTED (non-skipped) test
          # count, set to roughly half each suite's current size so a mass
          # importorskip/marker-drift regression fails the leg while normal
          # test-count churn does not. A floor of 1 would let a 49-of-50 skip
          # stay green.
          - backend: tf
            install: tensorflow-cpu
            marker: tf_backend
            import_check: "import tensorflow, keras"
            executed_floor: 18
          - backend: jax
            install: '"jax[cpu]" equinox flax'
            marker: backend_jax
            import_check: "import jax, jax.numpy, equinox, flax"
            executed_floor: 60
          - backend: tinygrad
            # Pinned to the exact version the backend runtime asserts. The
            # replay/derived-grad oracles require the PYTHON device.
            install: '"tinygrad==0.13.0"'
            marker: backend_tinygrad
            dev: PYTHON
            import_check: "import tinygrad"
            executed_floor: 25
          - backend: paddle
            # Pinned to the 3.3 minor stream the preview suite is validated
            # against (paddle 3.3.x in the parity env); paddle minors have
            # historically shifted C-extension/co-import behavior, so new
            # minors join the matrix deliberately, not by drift.
            install: '"paddlepaddle>=3.3,<3.4"'
            marker: backend_paddle
            import_check: "import paddle"
            executed_floor: 22
          - backend: mlx
            # MLX ships manylinux CPU wheels, so its suite runs on Linux CI;
            # pinned to 0.26.3 because the 0.26.5 manylinux wheel is missing
            # libmlx.so. Metal-path coverage still needs Apple silicon.
            install: '"mlx==0.26.3"'
            marker: backend_mlx
            import_check: "import mlx.core, mlx.nn"
            executed_floor: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install TorchLens and the ${{ matrix.backend }} preview backend
        run: |
          uv pip install --system -e ".[dev,test,tabular]"
          uv pip install --system ${{ matrix.install }}

      - name: Verify the ${{ matrix.backend }} runtime imports
        # A missing or import-broken framework must fail the leg here, not
        # dissolve into importorskip-skipped tests downstream.
        run: |
          python -c '${{ matrix.import_check }}'

      - name: Run ${{ matrix.backend }} preview backend tests
        env:
          # MLX's CPU JIT emits _FloatNN typedefs newer g++ rejects; the
          # uncompiled path is equivalent for capture. No-op for other legs.
          MLX_DISABLE_COMPILE: "1"
          TORCHLENS_RUN_UNSTABLE_MLX_TESTS: "1"
          # tinygrad leg only; empty (unread) elsewhere.
          DEV: ${{ matrix.dev || '' }}
        run: |
          pytest tests/ -m "${{ matrix.marker }} and not slow" --tb=short \
            --junitxml="${{ runner.temp }}/preview-${{ matrix.backend }}.junit.xml"

      - name: Fail on an under-executed ${{ matrix.backend }} suite
        # Second tripwire: even with the runtime importable, a mostly-skipped
        # suite (marker drift, collection regression, importorskip cascade)
        # must not stay green; each leg carries its own executed-test floor.
        run: |
          python scripts/check_ci_executed_tests.py \
            "${{ runner.temp }}/preview-${{ matrix.backend }}.junit.xml" \
            "${{ matrix.executed_floor }}"

  wheel:
    name: Wheel package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Build wheel
        run: |
          uv pip install --system build
          python -m build --wheel --outdir "${{ runner.temp }}/dist"

      - name: Install wheel in a clean venv
        run: |
          python -m venv "${{ runner.temp }}/wheel-venv"
          "${{ runner.temp }}/wheel-venv/bin/python" -m pip install --upgrade pip
          "${{ runner.temp }}/wheel-venv/bin/python" -m pip install "${{ runner.temp }}"/dist/torchlens-*.whl

      - name: Round-trip packaged tlspec
        working-directory: ${{ runner.temp }}
        run: |
          wheel-venv/bin/python -c "import torch, torchlens as tl; from torch import nn; from torchlens.validation import validate_tlspec; path='wheel-smoke.tlspec'; trace=tl.trace(nn.Linear(2, 1), torch.randn(1, 2), layers_to_save='none'); trace.save(path); validate_tlspec(path); loaded=tl.load(path); assert loaded.num_ops == trace.num_ops"

      - name: Run the packaging manifest tripwires
        # The wheel-diet and sdist-governance tests are slow-marked, so the
        # weekly slow tier was their only run and a packaging regression could
        # ship unnoticed for up to a week. Run them nightly, where the
        # artifacts are actually built (T13.5).
        run: |
          uv pip install --system \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match \
            -e ".[dev,tabular]" \
            "torch==2.8.0+cpu"
          pytest \
            "tests/test_packaging_diet.py::test_built_wheel_manifest_is_diet" \
            "tests/test_ci_packaging_gates.py::test_built_sdist_manifest_is_governed" \
            --tb=short -q
