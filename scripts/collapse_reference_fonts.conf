<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The committed Linux/Graphviz 2.43 gallery uses DejaVu Serif metrics.
     Pango expands Graphviz's Times-Roman to Times New Roman before matching.
     Pin all three spellings so installing MS corefonts/URW cannot change the
     reference geometry. This file is scoped to the reference generator only. -->
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family" compare="eq"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Times</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Times-Roman</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Serif</string></edit>
  </match>
</fontconfig>
